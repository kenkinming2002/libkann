type: "sequential"
layers:
  - type: "convolution"
    input_channel_count: 1
    output_channel_count: 3
    input_width: 28
    input_height: 28
    output_width: 32
    output_height: 32
    kernel_width: 5
    kernel_height: 5

  - type: "activation"
    shape: [3, 32, 32]
    function: "sigmoid"

  - type: "convolution"
    input_channel_count: 3
    output_channel_count: 3
    input_width: 32
    input_height: 32
    output_width: 28
    output_height: 28
    kernel_width: 5
    kernel_height: 5

  - type: "activation"
    shape: [3, 28, 28]
    function: "sigmoid"

  - type: "dense"
    input_shape : [3, 28, 28]
    output_shape : [10]

  - type: "activation"
    shape: [10]
    function: "sigmoid"
