    input_height: 28
    kernel_size: 5
    input_channel_count: 1
    output_channel_count: 5

  - type: "activation"
    size: 2880
    function: "sigmoid"

  - type: "weight"
    input_size: 2880
    output_size: 64

  - type: "activation"
    size : 64
    function: "sigmoid"
