type: "sequential"
layers:
  - type: "sequential"
    layers:
      - type: "reshape"
        input_shape : [28, 28]
        output_shape : [784]

      - type: "dense"
        input_size : 784
        output_size : 30

      - type: "activation"
        shape: [30]
        function: "sigmoid"

      - type: "dense"
        input_size : 30
        output_size : 2

      - type: "activation"
        shape: [2]
        function: "sigmoid"

  - type: "sequential"
    layers:
      - type: "dense"
        input_size : 2
        output_size : 30

      - type: "activation"
        shape: [30]
        function: "sigmoid"

      - type: "dense"
        input_size : 30
        output_size : 784

      - type: "activation"
        shape: [784]
        function: "sigmoid"

      - type: "reshape"
        input_shape : [784]
        output_shape : [28, 28]
