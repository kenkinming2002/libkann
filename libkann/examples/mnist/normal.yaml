type: "sequential"
layers:
  - type: "reshape"
    input_shape : [28, 28]
    output_shape : [784]

  - type: "dense"
    input_size : 784
    output_size : 30

  - type: "activation"
    shape: [30]
    function: "sigmoid"

  - type: "dense"
    input_size : 30
    output_size : 30

  - type: "activation"
    shape: [30]
    function: "sigmoid"

  - type: "dense"
    input_size : 30
    output_size : 30

  - type: "activation"
    shape: [30]
    function: "sigmoid"

  - type: "dense"
    input_size : 30
    output_size : 10

  - type: "activation"
    shape: [10]
    function: "sigmoid"

  - type: "softmax"
    shape: [10]
