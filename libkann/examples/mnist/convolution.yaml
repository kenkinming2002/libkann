type: "sequential"
layers:
  - type: "reshape"
    input_shape : [28, 28]
    output_shape : [1, 28, 28]

  - type: "convolution"
    input_channel_count: 1
    output_channel_count: 5
    input_width: 28
    input_height: 28
    output_width: 24
    output_height: 24
    kernel_width: 5
    kernel_height: 5

  - type: "activation"
    function: "sigmoid"

  - type: "convolution"
    input_channel_count: 5
    output_channel_count: 5
    input_width: 24
    input_height: 24
    output_width: 20
    output_height: 20
    kernel_width: 5
    kernel_height: 5

  - type: "activation"
    function: "sigmoid"

  - type: "reshape"
    input_shape  : [5, 20, 20]
    output_shape : [2000]

  - type: "dense"
    input_size : 2000
    output_size : 100

  - type: "activation"
    function: "sigmoid"

  - type: "dense"
    input_size : 100
    output_size : 10

  - type: "activation"
    function: "sigmoid"
